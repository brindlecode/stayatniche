[build]
  command = "npm run build"
  publish = "dist"
  base = "."
  # Skip deploys for commits that only touch pipeline data / docs (nightly bot commits).
  # The script builds whenever it cannot compare with the last built commit.
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "20"

# Keeps the build-time image copies between deploys (netlify/plugins/image-cache).
[[plugins]]
  package = "./netlify/plugins/image-cache"

# ── Production branch (the repo's default branch) ─────────────────────────────
[context.production]
  branch = "claude/setup-stayatniche-project-xHSQk"
  command = "npm run build"


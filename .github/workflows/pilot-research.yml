name: Pilot research (hotel audit + candidates)

on:
  workflow_dispatch:

# Nothing by default; the one job gets only what it needs.
permissions: {}

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits the report back to the branch
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: node scripts/pilot-research.mjs
      - name: Commit report to the same branch
        run: |
          git config user.name "stayatniche-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pilot
          git diff --cached --quiet && exit 0
          git commit -m "Pilot research report (OSM + Wikidata)"
          git push origin HEAD:${GITHUB_REF_NAME}

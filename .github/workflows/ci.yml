name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
# Read-only: CI only checks out the code, installs, tests and builds. It never pushes or comments.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Unit tests (affiliate URLs, analytics settings)
        run: npm test
      - name: No duplicate hotel pages
        run: node scripts/check-duplicates.mjs
      - run: npm run build
      - name: Sanity checks
        run: node scripts/check-build.mjs
